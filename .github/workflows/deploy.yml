name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-flight deploy finish; queue at most one newer run.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # base_path is "/<repo>" on <user>.github.io/<repo>, or "" with a custom domain.
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      # configure-pages does not flip an existing "Deploy from a branch" (Jekyll)
      # site to workflow mode. Without this, GitHub's legacy "pages build and
      # deployment" job races us and republishes README.md over the Next export.
      - name: Ensure Pages source is GitHub Actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -sS -X PUT \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/pages" \
            -d '{"build_type":"workflow"}' \
            -o /tmp/pages-source.json -w "%{http_code}" > /tmp/pages-source.status
          status=$(cat /tmp/pages-source.status)
          echo "PUT /pages → HTTP ${status}"
          cat /tmp/pages-source.json
          case "$status" in
            204|200) echo "Pages source is workflow (GitHub Actions)." ;;
            *)
              echo "::warning::Could not set build_type=workflow (HTTP ${status})."
              echo "Set it manually: Settings → Pages → Source → GitHub Actions"
              ;;
          esac

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static site
        run: pnpm build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.base_url }}
          NEXT_PUBLIC_FORM_ENDPOINT: ${{ vars.NEXT_PUBLIC_FORM_ENDPOINT || secrets.NEXT_PUBLIC_FORM_ENDPOINT }}
          NEXT_PUBLIC_FORM_ACCESS_KEY: ${{ vars.NEXT_PUBLIC_FORM_ACCESS_KEY || secrets.NEXT_PUBLIC_FORM_ACCESS_KEY }}
          NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION: ${{ vars.NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION || secrets.NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
